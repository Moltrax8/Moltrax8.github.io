# Sveltia CMS editor for the private Moltrax Astro source repository.
# Access is enforced by GitHub repository permissions, not by hiding /admin.
backend:
  name: github
  repo: Moltrax8/moltrax-site
  branch: main
  auth_methods: [token]

site_url: https://moltrax8.github.io
logo:
  src: /favicon.svg
media_folder: /public/images/competitions
public_folder: /images/competitions
output:
  omit_empty_optional_fields: true
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'
  lowercase: true

collections:
  - name: competitions
    label: CTF Competitions
    label_singular: Competition
    folder: /src/content/competitions
    create: true
    identifier_field: name
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    preview_path: '/competitions/{{slug}}/'
    fields:
      - { label: 'Competition name', name: name, widget: string }
      - { label: 'Start date', name: startDate, widget: datetime, type: date }
      - { label: 'End date', name: endDate, widget: datetime, type: date, required: false }
      - { label: 'Team', name: team, widget: string, required: false }
      - { label: 'Placement / rank', name: placement, widget: string, required: false }
      - { label: 'Official event URL', name: eventUrl, widget: string, required: false }
      - { label: 'Short description', name: summary, widget: text }
      - label: 'Event photos (optional, any number)'
        name: photos
        widget: list
        required: false
        collapsed: auto
        summary: '{{fields.alt}}'
        thumbnail: src
        fields:
          - { label: 'Upload photo', name: src, widget: image }
          - { label: 'Photo description (alt text)', name: alt, widget: string }
          - { label: 'Caption', name: caption, widget: string, required: false }
      - label: 'Certificate (optional)'
        name: certificate
        widget: object
        required: false
        fields:
          - { label: 'PDF, image or public URL', name: url, widget: file }
          - { label: 'Certificate label', name: label, widget: string, required: false }
      - { label: 'Keep unpublished (draft)', name: draft, widget: boolean, default: true }
      - { label: 'Experience and lessons learned', name: body, widget: markdown, required: false }

  - name: blog
    label: Blog Posts
    label_singular: Blog post
    folder: /src/content/blog
    create: true
    identifier_field: title
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    preview_path: '/blog/{{slug}}/'
    fields:
      - { label: 'Title', name: title, widget: string }
      - { label: 'Description', name: description, widget: text }
      - { label: 'Publish date', name: pubDate, widget: datetime, type: date }
      - { label: 'Tags', name: tags, widget: list, required: false, field: {label: Tag, name: tag, widget: string} }
      - { label: 'Keep unpublished (draft)', name: draft, widget: boolean, default: true }
      - { label: 'Article', name: body, widget: markdown }
